secrets:
  existingSecret: ""
secretFiles:
  AGENTMEMORY_SECRET: /run/credentials/AGENTMEMORY_SECRET
extraVolumes:
  - name: credentials
    secret:
      secretName: agentmemory-auth
      defaultMode: 0440
extraVolumeMounts:
  - name: credentials
    mountPath: /run/credentials
    readOnly: true
