# Overlay on examples/vault.yaml. API keys are Vault fields, never values here.
vault:
  fields: [AGENTMEMORY_SECRET, OPENAI_API_KEY]
llm:
  provider: openai
  openai:
    model: replace-with-your-chat-model
embeddings:
  provider: openai
  openai:
    model: text-embedding-3-small
features:
  autoCompress: true
