apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agentmemory-azure
  namespace: agentmemory
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: USER_ASSIGNED_CLIENT_ID
    keyvaultName: YOUR_KEY_VAULT_NAME
    tenantId: TENANT_ID
    objects: |
      array:
        - |
          objectName: agentmemory-secret
          objectAlias: AGENTMEMORY_SECRET
          objectType: secret
          filePermission: "0444"
