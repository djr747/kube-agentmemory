apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentmemory.fullname" . }}
  labels:
    {{- include "agentmemory.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      # Numeric targets also resolve restartable init-container ports on Kubernetes 1.30-1.32.
      targetPort: {{ if .Values.oauth2Proxy.protectApi }}4180{{ else }}3111{{ end }}
  selector:
    {{- include "agentmemory.selector" . | nindent 4 }}
{{- if .Values.oauth2Proxy.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentmemory.fullname" . }}-auth
  labels:
    {{- include "agentmemory.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports: [{name: oauth, port: 4180, targetPort: 4180}]
  selector:
    {{- include "agentmemory.selector" . | nindent 4 }}
{{- end }}
{{- if .Values.oauth2Proxy.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentmemory.fullname" . }}-ui
  labels:
    {{- include "agentmemory.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports: [{name: ui, port: 4180, targetPort: 4180}]
  selector:
    {{- include "agentmemory.selector" . | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentmemory.fullname" . }}-headless
  labels:
    {{- include "agentmemory.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: http
      # Headless DNS returns Pod IPs; it cannot translate the public Service port.
      port: {{ if .Values.oauth2Proxy.protectApi }}4180{{ else }}3111{{ end }}
      targetPort: {{ if .Values.oauth2Proxy.protectApi }}4180{{ else }}3111{{ end }}
  selector:
    {{- include "agentmemory.selector" . | nindent 4 }}
