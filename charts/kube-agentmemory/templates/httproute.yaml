{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agentmemory.fullname" . }}
  labels:
    {{- include "agentmemory.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.gateway.hostnames | nindent 4 }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /agentmemory}
      backendRefs:
        - name: {{ include "agentmemory.fullname" . }}
          port: {{ .Values.service.port }}
{{- if .Values.oauth2Proxy.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agentmemory.fullname" . }}-ui
  labels:
    {{- include "agentmemory.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames: [{{ .Values.oauth2Proxy.uiHost | quote }}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ include "agentmemory.fullname" . }}-auth
          port: 4180
{{- end }}
{{- end }}
