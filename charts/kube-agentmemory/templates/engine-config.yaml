apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentmemory.fullname" . }}-engine
  labels:
    {{- include "agentmemory.labels" . | nindent 4 }}
data:
  worker-compose.yaml: |
    namespace: agentmemory
    startup_timeout: 300s
    stop_timeout: 20s
    required_default: true
    engine:
      url: ws://127.0.0.1:49134
      workers:
        configuration:
          adapter:
            name: fs
            config:
              directory: /data/config
        iii-worker-manager:
          host: 127.0.0.1
          port: 49134
    containers:
      state:
        worker: package://api.workers.iii.dev/state
        version: "0.22.22"
        config_name: state
        restart: {condition: on-failure}
        config_override:
          adapter:
            name: kv
            config:
              store_method: file_based
              file_path: /data/state_store.db
              save_interval_ms: {{ index .Values.env "AGENTMEMORY_STATE_SAVE_INTERVAL_MS" | default "2000" | quote }}
      http:
        worker: package://api.workers.iii.dev/http
        version: "0.22.8"
        config_name: http
        restart: {condition: on-failure}
        config_override:
          host: 0.0.0.0
          port: 3111
          default_timeout: 180000
