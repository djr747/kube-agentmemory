{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentmemory.fullname" . }}
  labels:
    {{- include "agentmemory.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentmemory.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        {{- if not .Values.oauth2Proxy.protectApi }}
        - {protocol: TCP, port: 3111}
        {{- end }}
        {{- if .Values.oauth2Proxy.enabled }}
        - {protocol: TCP, port: 4180}
        {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.vault.enabled }}
    {{- toYaml .Values.networkPolicy.vaultEgress | nindent 4 }}
    {{- end }}
{{- end }}
