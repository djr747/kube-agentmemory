name: Release tested main artifacts
on:
  workflow_call:
permissions:
  contents: read
jobs:
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tags: ${{ steps.metadata.outputs.tags }}
      already_published: ${{ steps.preflight.outputs.already_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - id: metadata
        run: node tests/release-metadata.mjs
      - name: Verify tested source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Check release version and retry state before publishing
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/publish-release.mjs --check

  images:
    needs: prepare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare.outputs.already_published != 'true'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-${{ matrix.arch }}
      - name: Publish exactly the tested architecture
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker load -i candidate.tar
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag kube-agentmemory:ci "$image:sha-$GITHUB_SHA-$ARCH"
          docker push "$image:sha-$GITHUB_SHA-$ARCH"
          docker tag kube-agentmemory-engine:ci "$image-engine:sha-$GITHUB_SHA-$ARCH"
          docker push "$image-engine:sha-$GITHUB_SHA-$ARCH"

  artifacts:
    needs: [prepare, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare.outputs.already_published != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - run: node tests/release-metadata.mjs
      - name: Verify tested source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chart
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: reports-*
          path: reports
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2; Cosign v3.0.6
      - name: Assemble immutable tested image indexes
        id: indexes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for suffix in app engine; do
            repository="$image"
            if [ "$suffix" = engine ]; then repository="$image-engine"; fi
            docker manifest create "$repository:sha-$GITHUB_SHA" "$repository:sha-$GITHUB_SHA-amd64" "$repository:sha-$GITHUB_SHA-arm64"
            docker manifest push "$repository:sha-$GITHUB_SHA"
            digest="$(node tests/registry-digest.mjs "$repository:sha-$GITHUB_SHA")"
            echo "${suffix}_repository=$repository" >> "$GITHUB_OUTPUT"
            echo "${suffix}_digest=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Sign tested image indexes and attest architecture SBOMs
        env:
          APP_REPOSITORY: ${{ steps.indexes.outputs.app_repository }}
          APP_DIGEST: ${{ steps.indexes.outputs.app_digest }}
          ENGINE_REPOSITORY: ${{ steps.indexes.outputs.engine_repository }}
          ENGINE_DIGEST: ${{ steps.indexes.outputs.engine_digest }}
        run: |
          cosign sign --yes "$APP_REPOSITORY@$APP_DIGEST" "$ENGINE_REPOSITORY@$ENGINE_DIGEST"
          for arch in amd64 arm64; do
            app_digest="$(node tests/registry-digest.mjs "$APP_REPOSITORY:sha-$GITHUB_SHA-$arch")"
            engine_digest="$(node tests/registry-digest.mjs "$ENGINE_REPOSITORY:sha-$GITHUB_SHA-$arch")"
            cosign attest --yes --type spdxjson --predicate "reports/reports-$arch/sbom.spdx.json" "$APP_REPOSITORY@$app_digest"
            cosign attest --yes --type spdxjson --predicate "reports/reports-$arch/engine-sbom.spdx.json" "$ENGINE_REPOSITORY@$engine_digest"
          done
      - name: Attest app image provenance
        id: app-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.indexes.outputs.app_repository }}
          subject-digest: ${{ steps.indexes.outputs.app_digest }}
          push-to-registry: true
      - name: Attest engine image provenance
        id: engine-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.indexes.outputs.engine_repository }}
          subject-digest: ${{ steps.indexes.outputs.engine_digest }}
          push-to-registry: true
      - name: Attest tested Helm archive provenance
        id: chart-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz
      - name: Publish image aliases, OCI chart and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAGS: ${{ needs.prepare.outputs.tags }}
          APP_REPOSITORY: ${{ steps.indexes.outputs.app_repository }}
          APP_DIGEST: ${{ steps.indexes.outputs.app_digest }}
          ENGINE_REPOSITORY: ${{ steps.indexes.outputs.engine_repository }}
          ENGINE_DIGEST: ${{ steps.indexes.outputs.engine_digest }}
          APP_BUNDLE: ${{ steps.app-provenance.outputs.bundle-path }}
          ENGINE_BUNDLE: ${{ steps.engine-provenance.outputs.bundle-path }}
          CHART_BUNDLE: ${{ steps.chart-provenance.outputs.bundle-path }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IFS=',' read -ra aliases <<< "$TAGS"
          for tag in "${aliases[@]}"; do
            docker buildx imagetools create --tag "$APP_REPOSITORY:$tag" "$APP_REPOSITORY@$APP_DIGEST"
            docker buildx imagetools create --tag "$ENGINE_REPOSITORY:$tag" "$ENGINE_REPOSITORY@$ENGINE_DIGEST"
          done
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "dist/kube-agentmemory-$VERSION.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helm-charts"
          mkdir -p release-assets
          cp "$APP_BUNDLE" release-assets/app-provenance.json
          cp "$ENGINE_BUNDLE" release-assets/engine-provenance.json
          cp "$CHART_BUNDLE" release-assets/chart-provenance.json
          for arch in amd64 arm64; do
            cp "reports/reports-$arch/sbom.spdx.json" "release-assets/app-$arch.spdx.json"
            cp "reports/reports-$arch/engine-sbom.spdx.json" "release-assets/engine-$arch.spdx.json"
          done
          node tests/publish-release.mjs
