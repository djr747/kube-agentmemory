name: Build, security and integration
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Install verified locked npm tool
        run: |
          node build/bootstrap-npm.mjs --ci
          ln -sf npm-cli.js .build-tools/npm/bin/npm
          echo "$GITHUB_WORKSPACE/.build-tools/npm/bin" >> "$GITHUB_PATH"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.19.0
      - run: make install release-check test chart audit
      - name: Verify lock freshness
        run: |
          npm install --package-lock-only --include=optional --ignore-scripts --no-audit --no-fund
          npm install --prefix build/npm --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json build/npm/package-lock.json
      - run: make package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error
      # SonarQube Cloud's GitHub App runs Automatic Analysis separately.
      # Do not inject SONAR_TOKEN into PR runs or add a conflicting scanner Action.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/

  container:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Install verified locked npm tool
        run: |
          node build/bootstrap-npm.mjs --ci
          ln -sf npm-cli.js .build-tools/npm/bin/npm
          echo "$GITHUB_WORKSPACE/.build-tools/npm/bin" >> "$GITHUB_PATH"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        if: matrix.arch == 'amd64'
        with:
          version: v3.19.0
      - name: Enable the containerd image store for Copa
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
          set-host: true
      - name: Install verified Copa
        env:
          COPA_VERSION: '0.15.0'
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          copa_dir="$(mktemp -d)"
          cd "$copa_dir"
          archive="copa_${COPA_VERSION}_linux_${IMAGE_ARCH}.tar.gz"
          url="https://github.com/project-copacetic/copacetic/releases/download/v${COPA_VERSION}"
          curl --fail --silent --show-error --location --retry 3 --remote-name "$url/$archive"
          curl --fail --silent --show-error --location --retry 3 --remote-name "$url/copacetic_checksums.txt"
          awk -v archive="$archive" '$2 == archive {print}' copacetic_checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" copa
          echo "$copa_dir" >> "$GITHUB_PATH"
      - name: Build locked candidate
        run: |
          make build patch-images IMAGE=kube-agentmemory:ci ENGINE_IMAGE=kube-agentmemory-engine:ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.arch == 'amd64'
        with:
          name: chart
          path: dist
      - name: Scan candidate image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: kube-agentmemory:ci
          severity-cutoff: high
          fail-build: false # The blocking step evaluates both complete reports.
          grype-version: v0.120.1
          output-format: json
          output-file: grype-app.json
      - name: Scan engine image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: kube-agentmemory-engine:ci
          severity-cutoff: high
          fail-build: false
          grype-version: v0.120.1
          output-format: json
          output-file: grype-engine.json
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        if: matrix.arch == 'amd64'
        with:
          version: v0.33.0
          install_only: true
      - run: make integration-baseline
        if: matrix.arch == 'amd64'
      - name: Test release upgrade, memory, and OIDC through HTTPS Ingress
        if: matrix.arch == 'amd64'
        env:
          IMAGE: kube-agentmemory:ci
          ENGINE_IMAGE: kube-agentmemory-engine:ci
          CHART_ARCHIVE_DIR: dist
          INTEGRATION_CLUSTER: agentmemory-integration-${{ github.run_id }}-${{ matrix.arch }}
        run: make integration
      - name: Block high and critical image vulnerabilities
        # Report both the Ingress result and the blocking scan result on amd64.
        if: ${{ !cancelled() }}
        run: node tests/security-gate.mjs grype-app.json grype-engine.json
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: kube-agentmemory:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Generate engine SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: kube-agentmemory-engine:ci
          format: spdx-json
          output-file: engine-sbom.spdx.json
          upload-artifact: false
      - name: Verify release signing tool installation
        if: matrix.arch == 'amd64'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify release signing commands are available
        if: matrix.arch == 'amd64'
        run: |
          cosign version
          cosign sign --help >/dev/null
          cosign attest --help >/dev/null
      - name: Save the validated candidate
        run: docker save kube-agentmemory:ci kube-agentmemory-engine:ci -o candidate.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.arch }}
          path: candidate.tar
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-${{ matrix.arch }}
          path: |
            grype-*.json
            *sbom.spdx.json
            test-results/

  release:
    needs: [validate, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
