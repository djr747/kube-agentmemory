name: Build, security and integration
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Install verified locked npm tool
        env:
          NPM_BOOTSTRAP_TAR: tar
        run: |
          node build/bootstrap-npm.mjs build/npm "$RUNNER_TEMP/agentmemory-npm"
          ln -sf npm-cli.js "$RUNNER_TEMP/agentmemory-npm/bin/npm"
          echo "$RUNNER_TEMP/agentmemory-npm/bin" >> "$GITHUB_PATH"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - run: make install release-check test chart audit
      - name: Verify lock freshness
        run: |
          npm install --package-lock-only --include=optional --ignore-scripts --no-audit --no-fund
          npm install --prefix build/npm --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json build/npm/package-lock.json
      - run: make package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error
      - name: Check Sonar configuration
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            test -n "$SONAR_PROJECT_KEY"
            test -n "$SONAR_ORGANIZATION"
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Sonar scan unavailable: configure SONAR_TOKEN, SONAR_PROJECT_KEY and SONAR_ORGANIZATION. Required npm and Grype security gates still run.'
          fi
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        if: steps.sonar.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: coverage/

  container:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: Install verified locked npm tool
        env:
          NPM_BOOTSTRAP_TAR: tar
        run: |
          node build/bootstrap-npm.mjs build/npm "$RUNNER_TEMP/agentmemory-npm"
          ln -sf npm-cli.js "$RUNNER_TEMP/agentmemory-npm/bin/npm"
          echo "$RUNNER_TEMP/agentmemory-npm/bin" >> "$GITHUB_PATH"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Build locked candidate
        run: |
          npm ci --include=optional --no-fund --no-audit
          docker build -t kube-agentmemory:ci .
          docker build -f Dockerfile.engine -t kube-agentmemory-engine:ci .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chart
          path: dist
      - name: Scan candidate image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: kube-agentmemory:ci
          severity-cutoff: high
          fail-build: false # Full report; the JavaScript policy gate below decides failures.
          grype-version: v0.120.1
          output-format: json
          output-file: grype-app.json
      - name: Scan engine image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: kube-agentmemory-engine:ci
          severity-cutoff: high
          fail-build: false
          grype-version: v0.120.1
          output-format: json
          output-file: grype-engine.json
      - name: Enforce fixable high/critical vulnerability policy
        run: node tests/security-gate.mjs grype-app.json grype-engine.json
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: kube-agentmemory:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Generate engine SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: kube-agentmemory-engine:ci
          format: spdx-json
          output-file: engine-sbom.spdx.json
          upload-artifact: false
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          install_only: true
      - name: Test packaged chart with local embeddings
        env:
          IMAGE: kube-agentmemory:ci
          ENGINE_IMAGE: kube-agentmemory-engine:ci
          CHART_ARCHIVE_DIR: dist
          INTEGRATION_CLUSTER: agentmemory-integration-${{ github.run_id }}-${{ matrix.arch }}
        run: make integration
      - name: Save exactly the tested candidate
        run: docker save kube-agentmemory:ci kube-agentmemory-engine:ci -o candidate.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-${{ matrix.arch }}
          path: candidate.tar
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reports-${{ matrix.arch }}
          path: |
            grype-*.json
            *sbom.spdx.json
            test-results/

  release:
    needs: [validate, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
