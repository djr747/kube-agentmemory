version: 2
updates:
  - package-ecosystem: npm
    directory: /build/npm
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    groups:
      runtime:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
