version: 2
updates:
  - package-ecosystem: npm
    directory: /build/npm
    target-branch: develop
    # npm's own dependency ranges must match its verified source manifest.
    versioning-strategy: lockfile-only
    schedule: {interval: weekly}
    groups:
      npm-tool-lock:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule: {interval: weekly}
    groups:
      runtime:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ['*']
